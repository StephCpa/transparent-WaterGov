# nginx reverse proxy (HTTPS termination).  Replace server_name and certificate paths.
upstream levee_eval {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 443 ssl;
    server_name levee-eval.example.internal;

    ssl_certificate     /etc/nginx/certs/levee-eval.crt;
    ssl_certificate_key /etc/nginx/certs/levee-eval.key;

    client_max_body_size 5m;          # keep equal to LEVEE_EVAL_MAX_BODY_MB
    proxy_read_timeout   60s;

    location /api/v1/ {
        proxy_pass http://levee_eval;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
